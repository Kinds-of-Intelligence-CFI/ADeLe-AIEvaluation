# ============================================================================
# BUILD SYSTEM
# ============================================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ============================================================================
# PROJECT METADATA
# ============================================================================
[project]
name = "adele"
version = "0.1.0"
description = "ADeLe (Annotated Demand Levels) — A unified Python toolkit for AI evaluation with explanatory and predictive power."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kinds of Intelligence Team at CFI"},
]
keywords = [
    "ai-evaluation", "demand-levels", "ability-profiles",
    "benchmarks", "explainability", "predictive-power",
    "inspect-ai", "huggingface",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"

# ============================================================================
# DEPENDENCIES
# ============================================================================
# Core: enough for the CLI, dataframes, and loading data. Each workflow
# (evaluate / annotate / profile) adds its own heavy deps via an extra below,
# so e.g. `pip install adele[eval]` stays lightweight.
dependencies = [
    "click>=8.1",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "tqdm>=4.65",
]

# ============================================================================
# CLI ENTRY POINT
# ============================================================================
[project.scripts]
adele = "adele.cli:main"

# Register with Inspect so `inspect eval adele/adele_battery` resolves the task
# after `pip install`. See https://inspect.aisi.org.uk/extensions.html
[project.entry-points.inspect_ai]
adele = "adele.evaluation"

# ============================================================================
# URLS
# ============================================================================
[project.urls]
Homepage = "https://github.com/Kinds-of-Intelligence-CFI/ADeLe-AIEvaluation"
Documentation = "https://kinds-of-intelligence-cfi.github.io/ADELE/"
Repository = "https://github.com/Kinds-of-Intelligence-CFI/ADeLe-AIEvaluation.git"
"Bug Tracker" = "https://github.com/Kinds-of-Intelligence-CFI/ADeLe-AIEvaluation/issues"

# ============================================================================
# BUILD CONFIGURATION (Hatchling)
# ============================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/adele"]
# The rubric .txt files under src/adele/rubrics/data_v1 are picked up automatically
# (hatchling ships all files inside the package), so no force-include is needed.

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "README.md",
    "LICENSE",
]

# ============================================================================
# OPTIONAL DEPENDENCIES
# ============================================================================
[project.optional-dependencies]
# Run models on benchmarks / the ADeLe battery via Inspect AI.
eval = [
    "inspect-ai>=0.3",
    "huggingface_hub>=0.23",   # download the gated battery dataset
    "datasets>=2.14",          # `adele evaluate <registered-benchmark>` loads via load_benchmark
]
# Demand-level annotation of new benchmarks (multi-provider LLM judges).
annotate = [
    "openai>=1.30",
    "litellm>=1.30",           # unified LLM API (OpenAI, Gemini, Claude, ...)
    "tenacity>=8.2",
    "datasets>=2.14",          # load source benchmarks from HuggingFace
]
# Demand / ability profiling and predictive-power analysis.
analysis = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "scienceplots>=2.2",
]
# Everything.
all = [
    "adele[eval,annotate,analysis]",
]
dev = [
    "adele[all]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

# ============================================================================
# PYTEST CONFIGURATION
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

