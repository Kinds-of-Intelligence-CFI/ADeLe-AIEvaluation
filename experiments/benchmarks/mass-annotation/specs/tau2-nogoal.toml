# tau2-nogoal: as tau2-full, without part 3 of the task (how the run is graded), on the same 242 tau2 tasks, rubrics and
# judge (Pablo, 2026-10-26). Instance texts from experiments/benchmarks/tau2-nogoal/build.py
# (data/instances-tau2-nogoal, gitignored). Tasks whose prompts fit one Read; the rest are in tau2-nogoal-long.toml.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/tau2-nogoal.toml
name = "tau2-nogoal"

[tasks]
benchmarks = ["tau2-airline", "tau2-retail", "tau2-banking_knowledge"]
subset = "experiments/benchmarks/tau2-nogoal/subset.csv"
instances_dir = "data/instances-tau2-nogoal"

[rubrics]
refs = ["v2/PLp", "v2/PLe", "v2/PLs", "v2/MSm", "v2/MSc"]

[prompt]
builder = "v2-noreason"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "opus"
batch_size = 100
