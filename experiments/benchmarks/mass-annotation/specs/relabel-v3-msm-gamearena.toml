# relabel-v3 (MSm, gamearena): re-judges only the MSm cells whose relabel-v2 label is within one level of the
# changed example (MSm Levels 4-5: the Level 5 seller bullet shortened). See experiments/benchmarks/relabel-v3.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/relabel-v3-msm-gamearena.toml
name = "relabel-v3-msm-gamearena"

[tasks]
benchmarks = ["gamearena"]
subset = "experiments/benchmarks/relabel-v3/subsets/MSm_gamearena.csv"

[rubrics]
refs = ["v2/MSm"]

[prompt]
builder = "v2"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "opus"
batch_size = 100
