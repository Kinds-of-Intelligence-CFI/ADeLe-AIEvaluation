# tau2-full: the five released rubrics on the 242 released tau2 tasks, with the full task as input (Pablo, 2026-10-26).
# Instance texts from experiments/benchmarks/tau2-full/build.py (data/instances-tau2-full, gitignored). Tasks whose
# prompts fit one Read; the rest are in tau2-full-long.toml. See experiments/benchmarks/tau2-full.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/tau2-full.toml
name = "tau2-full"

[tasks]
benchmarks = ["tau2-airline", "tau2-retail", "tau2-banking_knowledge"]
subset = "experiments/benchmarks/tau2-full/subset.csv"
instances_dir = "data/instances-tau2-full"

[rubrics]
refs = ["v2/PLp", "v2/PLe", "v2/PLs", "v2/MSm", "v2/MSc"]

[prompt]
builder = "v2-noreason"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "opus"
batch_size = 100
