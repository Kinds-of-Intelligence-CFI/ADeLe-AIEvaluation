# The 54 rivercross grid states of rivercross-v2 amendment 2 (benchmark rivercross-search, register_search.py) on the
# two planning rubrics they lack: PLe and PLs (PLp text O is in plp-b2 run o-search). Amendment 4.
# Judge: Claude Code subagents, Opus 5.5 at effort low, v2 prompt.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/rivercross-search-pl.toml
name = "rivercross-search-pl"

[tasks]
benchmarks = ["rivercross-search"]

[rubrics]
refs = ["v2/PLe", "v2/PLs"]

[prompt]
builder = "v2"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "opus"
batch_size = 50
