# tie-rule-freeze (experiments/benchmarks/tie-rule-freeze): PL on the goal-visible inputs without the tie rule, regular
# and long inputs in one run (the API reads whole prompts), through the API with the subagent harness.
name = "notie-pl-goal"

[tasks]
benchmarks = ["swe-bench-verified", "deepswe-v1.1", "frontierswe-v2", "programbench", "terminal-bench-4.0.0",
              "terminal-bench-science-0.1"]
subset = "experiments/benchmarks/tie-rule-freeze/subset_goal.csv"
instances_dir = "data/instances-goal"

[rubrics]
refs = ["v2/PLp", "v2/PLe", "v2/PLs"]

[prompt]
builder = "v2-noreason-notie"

[judge]
backend = "anthropic-batch"
model = "claude-opus-5-5"
effort = "low"
harness = "subagent-v2-low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1, refusal = 0, error = 2 }
