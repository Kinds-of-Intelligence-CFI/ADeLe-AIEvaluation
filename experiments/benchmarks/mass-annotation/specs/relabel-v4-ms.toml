# relabel-v4-ms: MSm and MSc relabelled after their adoption on 2026-10-25 (experiments/benchmarks/ms-candidate; b05ddf3),
# on the same tasks as relabel-v2.toml, with the bare-digit prompt (production setting). See experiments/benchmarks/relabel-v4-ms.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/relabel-v4-ms.toml
name = "relabel-v4-ms"

[tasks]
benchmarks = ["swe-bench-verified", "tau2-airline", "tau2-retail", "tau2-banking_knowledge", "terminal-bench-4.0.0",
              "terminal-bench-science-0.1", "deepswe-v1.1", "frontierswe-v2", "programbench"]
subset = "experiments/benchmarks/pls-relabel/subset.csv"

[rubrics]
refs = ["v2/MSm", "v2/MSc"]

[prompt]
builder = "v2-noreason"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "opus"
batch_size = 100
