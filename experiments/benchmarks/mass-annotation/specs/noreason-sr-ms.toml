# noreason amendment 4b: twin of noreason-s-ms.toml with the v2 prompt (written reasoning, as in the released labels); nothing else changed.
# No-reasoning ablation (experiments/benchmarks/noreason): MS rubrics without written reasoning, on tau2 (the only clean set where MS varies).
#   adele mass plan experiments/benchmarks/mass-annotation/specs/noreason-ms.toml
name = "noreason-sr-ms"

[tasks]
benchmarks = ["tau2-airline", "tau2-retail", "tau2-banking_knowledge"]
subset = "experiments/benchmarks/noreason/tau2_subset.csv"

[rubrics]
refs = ["v2/MSm", "v2/MSc"]

[prompt]
builder = "v2"

[judge]
backend = "subagent"
model = "claude-sonnet-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "sonnet"
batch_size = 100
