# Bulk gate (PLAN.md §3): does the API judge give the same labels as the subagent judge? The 150-task reference
# subset x PLp, PLe, PLs with the bare-digit prompt: byte-identical prompts to run noreason-pl (subagent, same model and
# effort). Compare exact agreement with the NR labels against NR's rerun noise. Not pinned yet.
name = "gate-api-bridge"

[tasks]
benchmarks = ["swe-bench-verified", "tau2-airline", "tau2-retail", "tau2-banking_knowledge", "terminal-bench-4.0.0",
              "terminal-bench-science-0.1", "deepswe-v1.1", "frontierswe-v2", "programbench"]
subset = "experiments/benchmarks/noreason/refresh_subset.csv"

[rubrics]
refs = ["v2/PLp", "v2/PLe", "v2/PLs"]

[prompt]
builder = "v2-noreason"

[judge]
backend = "anthropic-batch"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1, refusal = 0, error = 2 }
