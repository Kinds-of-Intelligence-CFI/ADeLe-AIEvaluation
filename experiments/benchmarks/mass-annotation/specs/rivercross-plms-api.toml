# bulk-w1-rivercross-plms on the API instead of Claude Code subagents: the 54 rivercross-search states on the released
# PL and MS rubrics. Same prompt builder and judge; the subagent-v2-low harness reproduces what the subagent judge sees
# (experiments/benchmarks/harness-emulation). For anyone without the subagent relay, e.g. collaborators.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/rivercross-plms-api.toml
name = "rivercross-plms-api"

[tasks]
benchmarks = ["rivercross-search"]

[rubrics]
refs = ["v2/PLp", "v2/PLe", "v2/PLs", "v2/MSm", "v2/MSc"]

[prompt]
builder = "v2-noreason"

[judge]
backend = "anthropic-batch"
model = "claude-opus-5-5"
effort = "low"
harness = "subagent-v2-low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1, refusal = 0, error = 2 }
