# Bulk wave 1: the released PL and MS rubrics on rivercross-search, the one wave-1 set without them.
# On Claude Code subagents (2026-10-27), as goal-visible.toml; see experiments/benchmarks/wave1-v1/PREREGISTRATION.md.
name = "bulk-w1-rivercross-plms"

[tasks]
benchmarks = ["rivercross-search"]

[rubrics]
refs = ["v2/PLp", "v2/PLe", "v2/PLs", "v2/MSm", "v2/MSc"]

[prompt]
builder = "v2-noreason"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "opus"
batch_size = 100
