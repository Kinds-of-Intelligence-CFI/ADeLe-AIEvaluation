# Bulk gate 1 (PLAN.md §3): the first task of each wave-1 benchmark x the 17 v1 rubrics, through the Anthropic Batch
# API. Checks parsing, prompt sizes, refusals and cost per call before anything large. Not pinned yet.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/gate-dryrun.toml
name = "gate-dryrun"

[tasks]
benchmarks = ["cooperbench", "deepswe-v1.1", "eqbench4", "frontierswe-v2", "gamearena", "programbench", "rivercross-search",
              "swe-bench-verified", "tau2-airline", "tau2-banking_knowledge", "tau2-retail", "terminal-bench-4.0.0",
              "terminal-bench-science-0.1"]
subset = "experiments/benchmarks/mass-annotation/subsets/dryrun.csv"

[rubrics]
refs = ["v1/AS", "v1/AT", "v1/CEc", "v1/CEe", "v1/CL", "v1/KNa", "v1/KNc", "v1/KNf", "v1/KNn", "v1/KNs", "v1/MCr", "v1/MCt",
        "v1/MCu", "v1/QLl", "v1/QLq", "v1/SNs", "v1/VO"]

[prompt]
builder = "v2-noreason"

[judge]
backend = "anthropic-batch"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1, refusal = 0, error = 2 }
