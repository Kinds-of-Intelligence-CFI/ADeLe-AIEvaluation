# judge-choice (experiments/benchmarks/judge-choice): block pl, inputs data/instances, arm sonnet-low.
# Jose's prompt (v1-layout-noreason) in the subagent context, through the Batch API.
name = "jc-pl-inst-sonnet-low"

[tasks]
benchmarks = ["cooperbench", "eqbench4", "gamearena", "rivercross-search"]
subset = "experiments/benchmarks/judge-choice/subset_pl_inst.csv"
instances_dir = "data/instances"

[rubrics]
refs = ["v2/PLp", "v2/PLe"]

[prompt]
builder = "v1-layout-noreason"

[judge]
backend = "anthropic-batch"
model = "claude-sonnet-5-5"
effort = "low"
harness = "subagent-v2-low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1, refusal = 0, error = 2 }
