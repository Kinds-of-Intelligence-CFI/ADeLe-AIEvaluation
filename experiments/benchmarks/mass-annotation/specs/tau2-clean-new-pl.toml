# The 10 tau2 clean-set tasks without PL labels (experiments/benchmarks/tau2-clean/new_tasks.csv: banking_knowledge
# tasks solved only after tau2 v1.0.1's grading change) on the adopted v2 planning family (PLp = text O, PLe, PLs).
# The other 232 clean tasks are labelled already (plp-o-relabel o-tau2, pl-relabel-v2 v2-tau2).
# Judge: Claude Code subagents, Opus 5.5 at effort low, v2 prompt (the PL runs' setting). Not pinned or run yet.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/tau2-clean-new-pl.toml
name = "tau2-clean-new-pl"

[tasks]
benchmarks = ["tau2-airline", "tau2-retail", "tau2-banking_knowledge"]
subset = "experiments/benchmarks/tau2-clean/new_tasks.csv"

[rubrics]
refs = ["v2/PLp", "v2/PLe", "v2/PLs"]

[prompt]
builder = "v2"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "opus"
batch_size = 50
