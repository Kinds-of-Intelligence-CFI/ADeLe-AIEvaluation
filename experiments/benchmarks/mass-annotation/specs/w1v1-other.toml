# Wave 1 (BENCHMARKS.md) on Claude Code subagents: the 17 judged v1 rubrics on this group's wave-1 tasks, every prompt
# fits one Read, so this group has no -long run.
# Input per docs/judge-input.md (data/instances, as the released PL and MS labels). Routed by
# experiments/benchmarks/wave1-v1/route.py. See experiments/benchmarks/wave1-v1/PREREGISTRATION.md.
name = "w1v1-other"

[tasks]
benchmarks = ["cooperbench", "eqbench4", "gamearena", "rivercross-search"]
subset = "experiments/benchmarks/wave1-v1/subset_other.csv"

[rubrics]
refs = ["v1/AS", "v1/AT", "v1/CEc", "v1/CEe", "v1/CL", "v1/KNa", "v1/KNc", "v1/KNf", "v1/KNn", "v1/KNs", "v1/MCr", "v1/MCt",
        "v1/MCu", "v1/QLl", "v1/QLq", "v1/SNs", "v1/VO"]

[prompt]
builder = "v2-noreason"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "opus"
batch_size = 100
