# frontierswe-pl amendment 1: PLp (text O) on the 15 FrontierSWE v2 tasks the clean set drops (no model's best run
# reaches 0.9). Same prompt and judge as frontierswe-pl.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/frontierswe-pl-dropped.toml
name = "frontierswe-pl-dropped"

[tasks]
benchmarks = ["frontierswe-v2"]
subset = "experiments/benchmarks/frontierswe-pl/subset_dropped.csv"

[rubrics]
refs = ["v2/PLp"]

[prompt]
builder = "v2"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "opus"
batch_size = 50
