# DeepSWE v1.1 clean set (90 of 113 tasks: Epoch AI's 23 named defects dropped; experiments/benchmarks/deepswe-clean/)
# on the adopted v2 planning family (PLp = text O, PLe, PLs). Prompt: instruction.md verbatim, closing branch line kept.
# Judge: Claude Code subagents, Opus 5.5 at effort low, v2 prompt (the PL runs' setting). Not pinned or run yet.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/deepswe-clean.toml
name = "deepswe-clean"

[tasks]
benchmarks = ["deepswe-v1.1"]
subset = "experiments/benchmarks/deepswe-clean/tasks.csv"

[rubrics]
refs = ["v2/PLp", "v2/PLe", "v2/PLs"]

[prompt]
builder = "v2"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "opus"
batch_size = 50
