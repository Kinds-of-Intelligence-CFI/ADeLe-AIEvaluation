# The clean ProgramBench tasks (experiments/benchmarks/programbench-pl) whose judge prompts are too long for one Read
# call (subset_chunked.csv, from programbench-pl/route.py). Same judge model, effort and prompt; the judge reads in
# parts of 200 lines (chunk_lines) and the protocol check requires every prompt line to come back
# on the adopted v2 planning family (PLp = text O, PLe, PLs). Prompt = agent instruction + workspace file listing +
# documentation files in full, no truncation (programbench-data/NOTES.md).
# Judge: Claude Code subagents, Opus 5.5 at effort low, v2 prompt (the PL runs' setting).
#   adele mass plan experiments/benchmarks/mass-annotation/specs/programbench-pl-long.toml
name = "programbench-pl-long"

[tasks]
benchmarks = ["programbench"]
subset = "experiments/benchmarks/programbench-pl/subset_chunked.csv"

[rubrics]
refs = ["v2/PLp", "v2/PLe", "v2/PLs"]

[prompt]
builder = "v2"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low-chunked"
judge_agent = "adele-judge-v2-low-chunked"
model_alias = "opus"
batch_size = 50
chunk_lines = 200
