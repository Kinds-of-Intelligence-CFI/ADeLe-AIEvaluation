# Noise floor for bulk-w2-static (W2-STATIC.md): the same prompts, judged again, on a 3% stratified sample (7 tasks per set).
name = "bulk-w2-static-rejudge"

[tasks]
benchmarks = ["arc-agi-2", "gpqa-diamond", "arxivmath", "brokenarxiv"]
subset = "experiments/benchmarks/mass-annotation/subsets/w2_static_rejudge.csv"

[rubrics]
refs = ["v1/AS", "v1/AT", "v1/CEc", "v1/CEe", "v1/CL", "v1/KNa", "v1/KNc", "v1/KNf", "v1/KNn", "v1/KNs", "v1/MCr", "v1/MCt",
        "v1/MCu", "v1/QLl", "v1/QLq", "v1/SNs", "v1/VO", "v2/MSm"]

[prompt]
builder = "v2-noreason"

[judge]
backend = "anthropic-batch"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1, refusal = 0, error = 2 }
