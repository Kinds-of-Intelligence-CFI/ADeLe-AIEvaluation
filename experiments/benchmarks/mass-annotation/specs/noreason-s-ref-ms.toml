# noreason amendment 4: twin of noreason-ref-ms.toml with Sonnet 5.5 (effort low) as the judge; nothing else changed.
# No-reasoning ablation (experiments/benchmarks/noreason): same-day reference WITH reasoning (v2 prompt), current texts, 40 tau2 tasks, MS rubrics.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/noreason-ref-ms.toml
name = "noreason-s-ref-ms"

[tasks]
benchmarks = ["tau2-airline", "tau2-retail", "tau2-banking_knowledge"]
subset = "experiments/benchmarks/noreason/refresh_tau2_subset.csv"

[rubrics]
refs = ["v2/MSm", "v2/MSc"]

[prompt]
builder = "v2"

[judge]
backend = "subagent"
model = "claude-sonnet-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "sonnet"
batch_size = 100
