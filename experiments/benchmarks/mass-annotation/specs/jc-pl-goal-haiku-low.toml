# judge-choice (experiments/benchmarks/judge-choice): block pl, inputs data/instances-goal, arm haiku-low.
# Jose's prompt (v1-layout-noreason) in the subagent context, through the Batch API.
name = "jc-pl-goal-haiku-low"

[tasks]
benchmarks = ["deepswe-v1.1", "frontierswe-v2", "programbench", "swe-bench-verified", "terminal-bench-4.0.0", "terminal-bench-science-0.1"]
subset = "experiments/benchmarks/judge-choice/subset_pl_goal.csv"
instances_dir = "data/instances-goal"

[rubrics]
refs = ["v2/PLp", "v2/PLe"]

[prompt]
builder = "v1-layout-noreason"

[judge]
backend = "anthropic-batch"
model = "claude-haiku-5-5"
effort = "low"
harness = "subagent-v2-low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1, refusal = 0, error = 2 }
