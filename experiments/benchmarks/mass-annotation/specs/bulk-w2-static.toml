# Bulk wave 2, static sets (BENCHMARKS.md, decision 1): the 17 judged v1 rubrics plus v2 MSm on every task of ARC-AGI-2
# (public eval), GPQA Diamond, ArXivMath and BrokenArXiv (every month with model outputs). No PL rubrics on static
# sets. ArXivMath and BrokenArXiv 0826 ran with tools and were told the problems are open: annotate them here, analyse
# them apart. Launch only after the gates pass and with Pablo's go.
name = "bulk-w2-static"

[tasks]
benchmarks = ["arc-agi-2", "gpqa-diamond", "arxivmath", "brokenarxiv"]

[rubrics]
refs = ["v1/AS", "v1/AT", "v1/CEc", "v1/CEe", "v1/CL", "v1/KNa", "v1/KNc", "v1/KNf", "v1/KNn", "v1/KNs", "v1/MCr", "v1/MCt",
        "v1/MCu", "v1/QLl", "v1/QLq", "v1/SNs", "v1/VO", "v2/MSm"]

[prompt]
builder = "v2-noreason"

[judge]
backend = "anthropic-batch"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1, refusal = 0, error = 2 }
