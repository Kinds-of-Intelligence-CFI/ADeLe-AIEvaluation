# tau2-goal: as tau2-full, with the goal but without the grader's expected-action list, on the same 242 tau2 tasks,
# rubrics and judge (Pablo, 2026-10-26). Instance texts from experiments/benchmarks/tau2-goal/build.py
# (data/instances-tau2-goal, gitignored). Tasks whose prompts fit one Read; the rest are in tau2-goal-long.toml.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/tau2-goal.toml
name = "tau2-goal"

[tasks]
benchmarks = ["tau2-airline", "tau2-retail", "tau2-banking_knowledge"]
subset = "experiments/benchmarks/tau2-goal/subset.csv"
instances_dir = "data/instances-tau2-goal"

[rubrics]
refs = ["v2/PLp", "v2/PLe", "v2/PLs", "v2/MSm", "v2/MSc"]

[prompt]
builder = "v2-noreason"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "opus"
batch_size = 100
