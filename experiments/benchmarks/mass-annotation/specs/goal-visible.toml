# goal-visible: the five released rubrics on the 787 released coding and terminal tasks, with the goal written into the
# input (Pablo, 2026-10-26: no tests, no reference solution, but the goal must be clear). Instance texts from
# experiments/benchmarks/goal-visible/build.py (data/instances-goal, gitignored). Tasks whose prompts fit one Read; the
# rest are in goal-visible-long.toml. See experiments/benchmarks/goal-visible.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/goal-visible.toml
name = "goal-visible"

[tasks]
benchmarks = ["swe-bench-verified", "deepswe-v1.1", "frontierswe-v2", "programbench", "terminal-bench-4.0.0",
              "terminal-bench-science-0.1"]
subset = "experiments/benchmarks/goal-visible/subset.csv"
instances_dir = "data/instances-goal"

[rubrics]
refs = ["v2/PLp", "v2/PLe", "v2/PLs", "v2/MSm", "v2/MSc"]

[prompt]
builder = "v2-noreason"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "opus"
batch_size = 100
