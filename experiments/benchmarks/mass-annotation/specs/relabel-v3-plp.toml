# relabel-v3 (PLp, main): re-judges only the PLp cells whose relabel-v2 label is within one level of the
# changed example (PLp Levels 3-5: the synthesis bullet moved from Level 5 to 4). See experiments/benchmarks/relabel-v3.
#   adele mass plan experiments/benchmarks/mass-annotation/specs/relabel-v3-plp.toml
name = "relabel-v3-plp"

[tasks]
benchmarks = ["swe-bench-verified", "tau2-airline", "tau2-retail", "tau2-banking_knowledge", "terminal-bench-4.0.0",
              "terminal-bench-science-0.1", "deepswe-v1.1", "frontierswe-v2", "programbench"]
subset = "experiments/benchmarks/relabel-v3/subsets/PLp_main.csv"

[rubrics]
refs = ["v2/PLp"]

[prompt]
builder = "v2"

[judge]
backend = "subagent"
model = "claude-opus-5-5"
effort = "low"
repeats = 1
retry = { fallback_writer = 1, unparsed = 1 }

[judge.relay]
dispatcher = "judge-dispatcher-v2-low"
judge_agent = "adele-judge-v2-low"
model_alias = "opus"
batch_size = 100
